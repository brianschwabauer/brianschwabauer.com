<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/brandmark.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,200..1000;1,200..1000&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap"
			rel="stylesheet" />
		<script>
			// Pre-paint theme bootstrap — mirrors logic in src/routes/+layout.svelte
			// to prevent the light/dark flash on reload.
			(function () {
				try {
					var path = location.pathname;
					var theme;
					if (path === '/') {
						theme = 'dark';
					} else if (path === '/admin' || path.indexOf('/admin/') === 0) {
						var stored = localStorage.getItem('theme');
						if (stored === 'light' || stored === 'dark') {
							theme = stored;
						} else {
							theme =
								window.matchMedia &&
								window.matchMedia('(prefers-color-scheme: dark)').matches
									? 'dark'
									: 'light';
						}
					} else {
						theme = 'light';
					}
					document.documentElement.dataset.theme = theme;
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// EARLY-CLICK CAPTURE.
			//
			// Server-rendered controls look alive the moment they paint, but they
			// have no handlers until the page hydrates. On the home page that gap
			// is long enough to lose a click on the hero CTA, and the CTA is a gag
			// — "nothing happened" is the one response it must never give. SSRing
			// it `disabled` was the alternative and was rejected: a greyed-out
			// "Don't push this button" reads as broken.
			//
			// This is a classic (non-module) script at the END of the body, so it
			// runs as soon as the markup exists and always BEFORE the deferred
			// module bundle — i.e. before hydration, by construction. It records
			// at most one click on an opted-in control; the component replays it
			// on mount and detaches this listener, so the sequence can never fire
			// twice. With JS disabled nothing here runs and the button is inert,
			// exactly as it is today.
			(function () {
				var el = document.querySelector('[data-early-click]');
				if (!el) return;
				function onClick(e) {
					var hit =
						e.target && e.target.closest && e.target.closest('[data-early-click]');
					if (hit) window.__earlyClick = hit.getAttribute('data-early-click') || '1';
				}
				document.addEventListener('click', onClick, true);
				window.__earlyClickOff = function () {
					document.removeEventListener('click', onClick, true);
				};
			})();
		</script>
	</body>
</html>
